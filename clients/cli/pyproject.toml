[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemovela-cli"
version = "0.1.0"
description = "Command-line client for the Mnemovela cognition runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mnemovela-client>=0.1.0"]

[project.scripts]
mnemovela = "mnemovela_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
